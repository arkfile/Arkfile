# Isolated Arkfile and Bitcart lab. Project name arkfile-paylab.
# Mirrors arkfile-bitcart production hardening patterns: three-network Bitcart
# segmentation (edge, internal data, coins), passworded Postgres and coin RPC
# daemons, Electrum auto_connect=false seeding, Nginx checkout access_log off,
# strict public method/path gateway on :19080, and separate admin API/UI on :19081.

name: arkfile-paylab

x-bitcart-common: &bitcart-common
  BITCART_ENV: production
  LOG_LEVEL: INFO
  LOG_FILE: bitcart.log
  BITCART_DATADIR: /datadir
  BITCART_BACKUPS_DIR: /backups
  # Defaults are data/... and modules under /app. The API runs as electrum and
  # cannot create those. /plugins is chowned before startup.
  BITCART_BACKEND_PLUGINS_DIR: /plugins/backend
  BITCART_ADMIN_PLUGINS_DIR: /plugins/admin
  BITCART_STORE_PLUGINS_DIR: /plugins/store
  BITCART_DOCKER_PLUGINS_DIR: /plugins/docker
  BITCART_VOLUMES: /datadir /backups /plugins
  BITCART_CRYPTOS: ${BITCART_CRYPTOS:-btc}
  BTC_NETWORK: ${BTC_NETWORK:-mainnet}
  BTC_LIGHTNING: "false"
  XMR_NETWORK: ${XMR_NETWORK:-mainnet}
  BITCART_HOST: bitcart.lab:19080
  BITCART_HTTPS_ENABLED: "true"
  BITCART_REVERSEPROXY: none
  BITCART_BACKEND_ROOTPATH: /api
  BITCART_CHECKOUT_URL: https://bitcart.lab:19080
  BITCART_AGENT_TRANSPORT: none
  BITCART_ENABLE_SSH: "false"
  ONE_DOMAIN_MODE: "true"
  BITCART_API_WORKERS: "1"
  DB_HOST: database
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  BTC_HOST: bitcoin
  XMR_HOST: monero

services:
  ca:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/ca-init.sh"]
    volumes:
      - ./ca-init.sh:/ca-init.sh:ro
      - lab-ca-public:/ca-public
      - lab-tls-arkfile:/tls-arkfile
      - lab-tls-bitcart:/tls-bitcart
    networks:
      - arkfile-net

  secrets-init:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/secrets-init.sh"]
    volumes:
      - ./secrets-init.sh:/secrets-init.sh:ro
      - lab-config:/lab-config
      - bitcart-secrets:/bitcart-secrets
    networks:
      - arkfile-net

  rqlite:
    image: rqlite/rqlite:8.36.18
    hostname: rqlite
    command:
      - -auth
      - /auth/rqlite-auth.json
    volumes:
      - arkfile-rqlite:/rqlite/file
      - lab-config:/auth:ro
    networks:
      - arkfile-net
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  seaweedfs:
    image: chrislusf/seaweedfs:4.18
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=9332
      - -s3.config=/config/seaweedfs-s3.json
    volumes:
      - arkfile-seaweedfs:/data
      - lab-config:/config:ro
    networks:
      - arkfile-net
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  database:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    command: ["-c", "shared_buffers=128MB", "-c", "random_page_cost=1.1", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: bitcart
      POSTGRES_PASSWORD_FILE: /bitcart-secrets/pg-password
    volumes:
      - bitcart-db-data:/var/lib/postgresql/data
      - bitcart-secrets:/bitcart-secrets:ro
    networks:
      - bitcart-data
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitcart"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--protected-mode", "yes", "--save", "", "--appendonly", "no"]
    networks:
      - bitcart-data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  bitcoin:
    image: bitcart/bitcart-btc:stable
    command: ["/bin/sh", "-c", "/bin/sh /seed-btc-config.sh && set -a && . /bitcart-secrets/btc-rpc.env && set +a && exec just daemon btc"]
    environment:
      IN_DOCKER: "true"
      BTC_NETWORK: ${BTC_NETWORK:-mainnet}
      BTC_LIGHTNING: "false"
      BTC_SERVER: ${BTC_SERVER:-}
      BTC_ONESERVER: ${BTC_ONESERVER:-false}
    volumes:
      - bitcart-btc-data:/data
      - ./seed-btc-config.sh:/seed-btc-config.sh:ro
      - bitcart-secrets:/bitcart-secrets:ro
    networks:
      - bitcart-coins
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  monero:
    profiles: ["xmr"]
    image: bitcart/bitcart-xmr:stable
    command: ["/bin/sh", "-c", "set -a && . /bitcart-secrets/xmr-rpc.env && set +a && exec just daemon xmr"]
    environment:
      IN_DOCKER: "true"
      XMR_NETWORK: ${XMR_NETWORK:-mainnet}
      XMR_SERVER: ${XMR_SERVER:-https://xmr-node.cakewallet.com:18081}
      XMR_SEED_SERVER: ""
    volumes:
      - bitcart-xmr-data:/data
      - bitcart-secrets:/bitcart-secrets:ro
    networks:
      - bitcart-coins
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  backend:
    image: bitcart/bitcart:stable
    command: ["/bin/sh", "-c", "set -a && . /bitcart-secrets/backend-secrets.env && set +a && exec just prod-api-up"]
    environment:
      <<: *bitcart-common
      SSL_CERT_FILE: /ca/ca-bundle.crt
      REQUESTS_CA_BUNDLE: /ca/ca-bundle.crt
    volumes:
      - bitcart-datadir:/datadir
      - bitcart-backups:/backups
      - bitcart-plugins:/plugins
      - bitcart-secrets:/bitcart-secrets:ro
      - lab-ca-public:/ca:ro
    networks:
      - bitcart-edge
      - bitcart-data
      - bitcart-coins
    depends_on:
      ca:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      bitcoin:
        condition: service_started
      monero:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/cryptos\", timeout=3)'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  worker:
    image: bitcart/bitcart:stable
    command: ["/bin/sh", "-c", "set -a && . /bitcart-secrets/backend-secrets.env && set +a && exec just worker"]
    environment:
      <<: *bitcart-common
      SSL_CERT_FILE: /ca/ca-bundle.crt
      REQUESTS_CA_BUNDLE: /ca/ca-bundle.crt
    volumes:
      - bitcart-datadir:/datadir
      - bitcart-backups:/backups
      - bitcart-plugins:/plugins
      - bitcart-secrets:/bitcart-secrets:ro
      - lab-ca-public:/ca:ro
    networks:
      - arkfile-net
      - bitcart-data
      - bitcart-coins
    depends_on:
      ca:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      bitcoin:
        condition: service_started
      monero:
        condition: service_started
        required: false

  admin:
    image: bitcart/bitcart-admin:stable
    command: ["yarn", "start"]
    environment:
      ONE_DOMAIN_MODE: "true"
      BITCART_ADMIN_ROOTPATH: /
      BITCART_ADMIN_API_URL: https://bitcart.lab:19081/api
      BITCART_ADMIN_SERVER_API_URL: http://backend:8000
    networks:
      - bitcart-edge
    depends_on:
      backend:
        condition: service_healthy

  checkout:
    image: bitcart/bitcart-checkout:stable
    environment:
      ONE_DOMAIN_MODE: "true"
      BITCART_API_URL: https://bitcart.lab:19080/api
      BITCART_CHECKOUT_URL: https://bitcart.lab:19080
    volumes:
      - ./checkout-privacy.conf:/etc/nginx/conf.d/00-privacy.conf:ro
    networks:
      - bitcart-edge
    depends_on:
      backend:
        condition: service_healthy

  bitcart-proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:19080:19080"
      - "127.0.0.1:19081:19081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - lab-tls-bitcart:/certs:ro
    networks:
      arkfile-net:
        aliases:
          - bitcart.lab
      bitcart-edge:
        aliases:
          - bitcart.lab
    depends_on:
      ca:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      admin:
        condition: service_started
      checkout:
        condition: service_started

  provision:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/provision/provision.sh"]
    environment:
      BITCART_ADMIN_API: https://bitcart.lab:19081/api
      BITCART_PUBLIC_API: https://bitcart.lab:19080/api
      BITCART_ADMIN_PASSWORD: ${BITCART_ADMIN_PASSWORD:-}
      BTC_XPUB: ${BTC_XPUB:-}
      BITCART_CRYPTOS: ${BITCART_CRYPTOS:-btc}
      BITCART_TX_SPEED: ${BITCART_TX_SPEED:-1}
      XMR_TX_SPEED: ${XMR_TX_SPEED:-5}
      XMR_ADDRESS: ${XMR_ADDRESS:-}
      XMR_PRIVATE_VIEW_KEY: ${XMR_PRIVATE_VIEW_KEY:-}
      XMR_RESTORE_HEIGHT: ${XMR_RESTORE_HEIGHT:-}
      BITCART_LOG_RETENTION_DAYS: ${BITCART_LOG_RETENTION_DAYS:-21}
    volumes:
      - ./provision/provision.sh:/provision/provision.sh:ro
      - lab-config:/lab-config
      - lab-ca-public:/ca:ro
    networks:
      - bitcart-edge
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      bitcart-proxy:
        condition: service_started
      worker:
        condition: service_started

  arkfile:
    build:
      context: ${ARKFILE_PAYLAB_IMAGE_CONTEXT:-/tmp/arkfile-bitcart-lab/image}
      dockerfile: Containerfile.arkfile
    hostname: arkfile
    ports:
      - "127.0.0.1:18443:18443"
    environment:
      HOST: 0.0.0.0
      PORT: "8088"
      TLS_ENABLED: "true"
      TLS_PORT: "18443"
      TLS_CERT_FILE: /tls/arkfile.crt
      TLS_KEY_FILE: /tls/arkfile.key
      BASE_URL: https://arkfile.lab:18443
      ARKFILE_DOMAIN: arkfile.lab
      CORS_ALLOWED_ORIGINS: https://arkfile.lab:18443
      DEBUG_MODE: "false"
      LOG_LEVEL: info
      REQUIRE_APPROVAL: "false"
      ENABLE_REGISTRATION: "true"
      ADMIN_USERNAMES: paylab-admin
      RQLITE_NODES: rqlite:4001
      RQLITE_ADDRESS: http://rqlite:4001
      RQLITE_USERNAME: lab-user
      STORAGE_PROVIDER_1: generic-s3
      STORAGE_PROVIDER_1_ID: generic-s3:arkfile-paylab
      STORAGE_1_ENDPOINT: http://seaweedfs:9332
      STORAGE_1_ACCESS_KEY: arkfile-paylab
      STORAGE_1_BUCKET: arkfile-paylab
      STORAGE_1_REGION: us-east-1
      STORAGE_1_FORCE_PATH_STYLE: "true"
      STORAGE_1_USE_SSL: "false"
      ARKFILE_BILLING_ENABLED: "true"
      ARKFILE_BILLING_PAYG_ENABLED: "true"
      ARKFILE_CUSTOMER_PRICE_USD_PER_TB_PER_MONTH: ${ARKFILE_CUSTOMER_PRICE_USD_PER_TB_PER_MONTH:-10.00}
      ARKFILE_FREE_STORAGE_BYTES: ${ARKFILE_FREE_STORAGE_BYTES:-1073741824}
      ARKFILE_BILLING_TICK_INTERVAL: ${ARKFILE_BILLING_TICK_INTERVAL:-1h}
      ARKFILE_MIN_TOP_UP_USD: ${ARKFILE_MIN_TOP_UP_USD:-0.50}
      ARKFILE_MAX_TOP_UP_USD: "1000.00"
      ARKFILE_PAYMENTS_ENABLED: "true"
      ARKFILE_BITCART_API_URL: https://bitcart.lab:19080/api
      ARKFILE_BITCART_CHECKOUT_URL: https://bitcart.lab:19080
      ARKFILE_SUBSCRIPTIONS_ENABLED: "false"
      SSL_CERT_FILE: /ca/ca-bundle.crt
      HOME: /opt/arkfile/var/home
    volumes:
      - lab-config:/lab-config:ro
      - lab-ca-public:/ca:ro
      - lab-tls-arkfile:/tls:ro
      - arkfile-keys:/opt/arkfile/etc/keys
      - arkfile-var:/opt/arkfile/var
    networks:
      arkfile-net:
        aliases:
          - arkfile.lab
    depends_on:
      provision:
        condition: service_completed_successfully
      rqlite:
        condition: service_started
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/ca/ca-bundle.crt", "https://127.0.0.1:18443/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  arkfile-net:
    name: arkfile-paylab-arkfile
  bitcart-edge:
    name: arkfile-paylab-edge
  bitcart-data:
    name: arkfile-paylab-data
    internal: true
  bitcart-coins:
    name: arkfile-paylab-coins

volumes:
  lab-ca-public:
  lab-tls-arkfile:
  lab-tls-bitcart:
  lab-config:
  bitcart-secrets:
  arkfile-rqlite:
  arkfile-seaweedfs:
  arkfile-keys:
  arkfile-var:
  bitcart-db-data:
  bitcart-datadir:
  bitcart-backups:
  bitcart-plugins:
  bitcart-btc-data:
  bitcart-xmr-data:
